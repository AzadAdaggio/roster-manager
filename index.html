<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player & Lineup Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Navigation Bar -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-indigo-600 rounded-lg">
        <i data-lucide="shield" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide">RosterPro</h1>
        <p class="text-xs text-slate-400">Player & Lineup Management</p>
      </div>
    </div>
    
    <!-- Tab Switching -->
    <nav class="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
      <button id="tab-roster-btn" onclick="switchTab('roster')" class="px-4 py-2 text-sm font-medium rounded-lg transition-all bg-indigo-600 text-white shadow">
        Squad Roster
      </button>
      <button id="tab-events-btn" onclick="switchTab('events')" class="px-4 py-2 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white">
        Event Lineups
      </button>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    
    <!-- ==================== TAB 1: SQUAD ROSTER ==================== -->
    <section id="tab-roster" class="space-y-6">
      <div class="flex justify-between items-center flex-wrap gap-4">
        <div>
          <h2 class="text-2xl font-bold">Player Roster</h2>
          <p class="text-slate-400 text-sm">Manage players, positions, and operational roles.</p>
        </div>
        <button onclick="openPlayerModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
          <i data-lucide="user-plus" class="w-4 h-4"></i> Add New Player
        </button>
      </div>

      <!-- Player Table Card -->
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/60 text-xs uppercase text-slate-400 border-b border-slate-700">
              <tr>
                <th class="px-6 py-3">Player Name</th>
                <th class="px-6 py-3">Assigned Role</th>
                <th class="px-6 py-3">Status</th>
                <th class="px-6 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="player-table-body" class="divide-y divide-slate-700/50">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: EVENT LINEUPS ==================== -->
    <section id="tab-events" class="hidden space-y-6">
      <div class="flex justify-between items-center flex-wrap gap-4">
        <div>
          <h2 class="text-2xl font-bold">Event Battlefield Builder</h2>
          <p class="text-slate-400 text-sm">Create events, assign teams to battlefields, and manage lineups.</p>
        </div>
        <button onclick="openEventModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
          <i data-lucide="calendar-plus" class="w-4 h-4"></i> Create Event
        </button>
      </div>

      <!-- Event Selector Header -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <label for="event-select" class="text-sm font-medium text-slate-400">Select Event:</label>
          <select id="event-select" onchange="loadEventBattlefields()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <!-- Rendered via JS -->
          </select>
        </div>
        <div id="event-details-bar" class="text-xs text-slate-400 flex gap-4">
          <!-- Rendered via JS -->
        </div>
        <div class="flex gap-2">
          <button onclick="openBattlefieldModal()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg font-medium text-sm transition">
            <i data-lucide="map-pin" class="w-4 h-4"></i> Add Battlefield
          </button>
          <button onclick="deleteCurrentEvent()" class="flex items-center gap-2 bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg font-medium text-sm transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Delete Event
          </button>
        </div>
      </div>

      <!-- Battlefields Container -->
      <div id="battlefields-container" class="space-y-6">
        <!-- Battlefields rendered via JS -->
      </div>
    </section>

  </main>

  <!-- ==================== MODALS ==================== -->
  <!-- Player Modal -->
  <div id="player-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl">
      <h3 id="player-modal-title" class="text-lg font-bold mb-4">Add New Player</h3>
      <form id="player-form" onsubmit="savePlayer(event)" class="space-y-4">
        <input type="hidden" id="player-id">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
          <input type="text" id="player-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Assigned Role / Position</label>
          <input type="text" id="player-role" placeholder="e.g. Captain, Striker, In-Game Leader" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
          <select id="player-status" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="Active">Active</option>
            <option value="Reserve">Reserve</option>
            <option value="Injured/Inactive">Injured/Inactive</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closePlayerModal()" class="px-4 py-2 text-sm rounded-lg text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Save Player</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Modal -->
  <div id="event-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Create New Event</h3>
      <form id="event-form" onsubmit="saveEvent(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Event Name</label>
          <input type="text" id="event-title" placeholder="e.g. Regional Qualifier Game 1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Event Date</label>
          <input type="date" id="event-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeEventModal()" class="px-4 py-2 text-sm rounded-lg text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Create Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Battlefield Modal -->
  <div id="battlefield-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Create Battlefield</h3>
      <form id="battlefield-form" onsubmit="saveBattlefield(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Battlefield Name</label>
          <input type="text" id="battlefield-name" placeholder="e.g. Arena A, Map 1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Team Name</label>
          <input type="text" id="team-name" placeholder="e.g. Red Team, Team Alpha" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeBattlefieldModal()" class="px-4 py-2 text-sm rounded-lg text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium">Create Battlefield</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // --- Application State ---
    let players = JSON.parse(localStorage.getItem('roster_players')) || [
      { id: '1', name: 'Alex Mercer', role: 'Captain / IGL', status: 'Active' },
      { id: '2', name: 'Samantha Vance', role: 'Support', status: 'Active' },
      { id: '3', name: 'Marcus Brody', role: 'Frontline / Entry', status: 'Active' },
      { id: '4', name: 'Elena Rostova', role: 'Sniper / Anchor', status: 'Active' },
      { id: '5', name: 'David Chen', role: 'Flex / Utility', status: 'Reserve' }
    ];

    let events = JSON.parse(localStorage.getItem('roster_events')) || [
      { 
        id: 'e1', 
        title: 'Championship Finals', 
        date: '2026-10-15', 
        battlefields: [
          { 
            id: 'bf1', 
            name: 'Arena A', 
            teams: [
              { id: 't1', name: 'Team Alpha', lineups: { starters: ['1', '2', '3'], reserves: ['4'] } }
            ] 
          }
        ]
      }
    ];

    let currentEventId = events.length > 0 ? events[0].id : null;

    // --- Core Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderPlayerTable();
      renderEventDropdown();
      loadEventBattlefields();
    });

    function saveData() {
      localStorage.setItem('roster_players', JSON.stringify(players));
      localStorage.setItem('roster_events', JSON.stringify(events));
    }

    // --- Tab Switching ---
    function switchTab(tab) {
      const rosterTab = document.getElementById('tab-roster');
      const eventsTab = document.getElementById('tab-events');
      const rosterBtn = document.getElementById('tab-roster-btn');
      const eventsBtn = document.getElementById('tab-events-btn');

      if (tab === 'roster') {
        rosterTab.classList.remove('hidden');
        eventsTab.classList.add('hidden');
        rosterBtn.className = "px-4 py-2 text-sm font-medium rounded-lg transition-all bg-indigo-600 text-white shadow";
        eventsBtn.className = "px-4 py-2 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white";
      } else {
        eventsTab.classList.remove('hidden');
        rosterTab.classList.add('hidden');
        eventsBtn.className = "px-4 py-2 text-sm font-medium rounded-lg transition-all bg-indigo-600 text-white shadow";
        rosterBtn.className = "px-4 py-2 text-sm font-medium rounded-lg transition-all text-slate-400 hover:text-white";
        loadEventBattlefields();
      }
    }

    // --- Player Management ---
    function renderPlayerTable() {
      const tbody = document.getElementById('player-table-body');
      tbody.innerHTML = '';

      if (players.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">No players registered. Click "Add New Player" to get started.</td></tr>`;
        return;
      }

      players.forEach(p => {
        let badgeColor = 'bg-slate-700 text-slate-300';
        if (p.status === 'Active') badgeColor = 'bg-emerald-950 text-emerald-400 border border-emerald-800/50';
        if (p.status === 'Injured/Inactive') badgeColor = 'bg-rose-950 text-rose-400 border border-rose-800/50';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="px-6 py-4 font-medium text-slate-100 flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-indigo-400">
                ${p.name.charAt(0)}
              </div>
              ${p.name}
            </td>
            <td class="px-6 py-4 text-slate-300">${p.role}</td>
            <td class="px-6 py-4">
              <span class="text-xs px-2.5 py-1 rounded-full ${badgeColor}">${p.status}</span>
            </td>
            <td class="px-6 py-4 text-right space-x-2">
              <button onclick="editPlayer('${p.id}')" class="text-slate-400 hover:text-indigo-400 transition"><i data-lucide="edit-2" class="w-4 h-4 inline"></i></button>
              <button onclick="deletePlayer('${p.id}')" class="text-slate-400 hover:text-rose-400 transition"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button>
            </td>
          </tr>
        `;
      });
      lucide.createIcons();
    }

    function openPlayerModal(editId = null) {
      const modal = document.getElementById('player-modal');
      const title = document.getElementById('player-modal-title');
      document.getElementById('player-form').reset();
      document.getElementById('player-id').value = '';

      if (editId) {
        const player = players.find(p => p.id === editId);
        if (player) {
          title.textContent = 'Edit Player';
          document.getElementById('player-id').value = player.id;
          document.getElementById('player-name').value = player.name;
          document.getElementById('player-role').value = player.role;
          document.getElementById('player-status').value = player.status;
        }
      } else {
        title.textContent = 'Add New Player';
      }
      modal.classList.remove('hidden');
    }

    function closePlayerModal() {
      document.getElementById('player-modal').classList.add('hidden');
    }

    function savePlayer(e) {
      e.preventDefault();
      const id = document.getElementById('player-id').value;
      const name = document.getElementById('player-name').value;
      const role = document.getElementById('player-role').value;
      const status = document.getElementById('player-status').value;

      if (id) {
        const idx = players.findIndex(p => p.id === id);
        if (idx !== -1) players[idx] = { id, name, role, status };
      } else {
        players.push({ id: Date.now().toString(), name, role, status });
      }

      saveData();
      renderPlayerTable();
      closePlayerModal();
    }

    function editPlayer(id) { openPlayerModal(id); }

    function deletePlayer(id) {
      if (!confirm('Are you sure you want to delete this player?')) return;
      players = players.filter(p => p.id !== id);
      // Remove from all event lineups
      events.forEach(e => {
        e.battlefields.forEach(bf => {
          bf.teams.forEach(t => {
            t.lineups.starters = t.lineups.starters.filter(pid => pid !== id);
            t.lineups.reserves = t.lineups.reserves.filter(pid => pid !== id);
          });
        });
      });
      saveData();
      renderPlayerTable();
      loadEventBattlefields();
    }

    // --- Event & Battlefield Management ---
    function renderEventDropdown() {
      const select = document.getElementById('event-select');
      select.innerHTML = '';

      if (events.length === 0) {
        select.innerHTML = `<option value="">No events available</option>`;
        return;
      }

      events.forEach(e => {
        select.innerHTML += `<option value="${e.id}" ${e.id === currentEventId ? 'selected' : ''}>${e.title}</option>`;
      });

      if (!currentEventId && events.length > 0) currentEventId = events[0].id;
    }

    function openEventModal() {
      document.getElementById('event-form').reset();
      document.getElementById('event-modal').classList.remove('hidden');
    }

    function closeEventModal() {
      document.getElementById('event-modal').classList.add('hidden');
    }

    function saveEvent(e) {
      e.preventDefault();
      const title = document.getElementById('event-title').value;
      const date = document.getElementById('event-date').value;

      const newEvent = {
        id: 'e_' + Date.now(),
        title,
        date,
        battlefields: []
      };

      events.push(newEvent);
      currentEventId = newEvent.id;
      saveData();
      renderEventDropdown();
      loadEventBattlefields();
      closeEventModal();
    }

    function deleteCurrentEvent() {
      if (!currentEventId) {
        alert('No event selected');
        return;
      }

      const currentEvent = events.find(e => e.id === currentEventId);
      if (!currentEvent) return;

      if (!confirm(`Delete event "${currentEvent.title}" and all its battlefields and teams?`)) return;

      events = events.filter(e => e.id !== currentEventId);
      currentEventId = events.length > 0 ? events[0].id : null;
      saveData();
      renderEventDropdown();
      loadEventBattlefields();
    }

    function openBattlefieldModal() {
      if (!currentEventId) {
        alert('Please create or select an event first');
        return;
      }
      document.getElementById('battlefield-form').reset();
      document.getElementById('battlefield-modal').classList.remove('hidden');
    }

    function closeBattlefieldModal() {
      document.getElementById('battlefield-modal').classList.add('hidden');
    }

    function saveBattlefield(e) {
      e.preventDefault();
      const battlefieldName = document.getElementById('battlefield-name').value;
      const teamName = document.getElementById('team-name').value;

      const currentEvent = events.find(ev => ev.id === currentEventId);
      if (!currentEvent) return;

      const newBattlefield = {
        id: 'bf_' + Date.now(),
        name: battlefieldName,
        teams: [
          {
            id: 't_' + Date.now(),
            name: teamName,
            lineups: { starters: [], reserves: [] }
          }
        ]
      };

      currentEvent.battlefields.push(newBattlefield);
      saveData();
      loadEventBattlefields();
      closeBattlefieldModal();
    }

    function loadEventBattlefields() {
      const select = document.getElementById('event-select');
      currentEventId = select.value;
      const currentEvent = events.find(e => e.id === currentEventId);

      const container = document.getElementById('battlefields-container');
      container.innerHTML = '';

      if (!currentEvent) {
        document.getElementById('event-details-bar').innerHTML = '<span>No event selected.</span>';
        return;
      }

      document.getElementById('event-details-bar').innerHTML = `<span><i data-lucide="calendar" class="w-3.5 h-3.5 inline mr-1"></i> ${currentEvent.date}</span>`;

      if (currentEvent.battlefields.length === 0) {
        container.innerHTML = `<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">No battlefields yet. Click "Add Battlefield" to create one.</div>`;
        lucide.createIcons();
        return;
      }

      currentEvent.battlefields.forEach(battlefield => {
        const battlefieldCard = createBattlefieldCard(battlefield, currentEvent);
        container.appendChild(battlefieldCard);
      });

      lucide.createIcons();
    }

    function createBattlefieldCard(battlefield, currentEvent) {
      const div = document.createElement('div');
      div.className = "bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg";

      let battlefieldHTML = `
        <div class="bg-slate-900/60 px-6 py-3 border-b border-slate-700 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <i data-lucide="map-pin" class="w-5 h-5 text-emerald-400"></i>
            <h3 class="text-lg font-bold text-slate-100">${battlefield.name}</h3>
          </div>
          <button onclick="deleteBattlefield('${currentEvent.id}', '${battlefield.id}')" class="text-slate-400 hover:text-rose-400 transition">
            <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
          </button>
        </div>
        <div class="p-4 space-y-4">
      `;

      battlefield.teams.forEach(team => {
        const starterIds = team.lineups.starters || [];
        const reserveIds = team.lineups.reserves || [];
        let unassignedCount = 0;
        let startersCount = 0;
        let reservesCount = 0;

        players.forEach(player => {
          if (starterIds.includes(player.id)) startersCount++;
          else if (reserveIds.includes(player.id)) reservesCount++;
          else unassignedCount++;
        });

        battlefieldHTML += `
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <h4 class="text-md font-semibold text-indigo-400">🎯 ${team.name}</h4>
              <button onclick="deleteTeam('${currentEvent.id}', '${battlefield.id}', '${team.id}')" class="text-slate-400 hover:text-rose-400 transition text-xs">
                <i data-lucide="x" class="w-3 h-3 inline"></i> Remove Team
              </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <!-- Unassigned Pool -->
              <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/60">
                <h5 class="text-xs font-semibold text-slate-300 mb-2 flex items-center justify-between">
                  <span><i data-lucide="users" class="w-3 h-3 inline mr-1"></i>Available</span>
                  <span class="bg-slate-700 px-2 py-0.5 rounded text-[10px]">${unassignedCount}</span>
                </h5>
                <div id="zone-unassigned-${team.id}" ondragover="allowDrop(event)" ondrop="drop(event, '${currentEvent.id}', '${battlefield.id}', '${team.id}', 'unassigned')" class="bg-slate-800/50 rounded p-2 min-h-[150px] overflow-y-auto space-y-2">
        `;

        players.forEach(player => {
          if (!starterIds.includes(player.id) && !reserveIds.includes(player.id)) {
            battlefieldHTML += createPlayerCardHTML(player, team.id);
          }
        });

        battlefieldHTML += `
                </div>
              </div>

              <!-- Starting Lineup -->
              <div class="bg-emerald-950/30 p-3 rounded-lg border border-emerald-800/40">
                <h5 class="text-xs font-semibold text-emerald-400 mb-2 flex items-center justify-between">
                  <span><i data-lucide="star" class="w-3 h-3 inline mr-1"></i>Starters</span>
                  <span class="bg-emerald-950 px-2 py-0.5 rounded text-[10px]">${startersCount}</span>
                </h5>
                <div id="zone-starters-${team.id}" ondragover="allowDrop(event)" ondrop="drop(event, '${currentEvent.id}', '${battlefield.id}', '${team.id}', 'starters')" class="bg-slate-800/50 rounded p-2 min-h-[150px] overflow-y-auto space-y-2">
        `;

        players.forEach(player => {
          if (starterIds.includes(player.id)) {
            battlefieldHTML += createPlayerCardHTML(player, team.id);
          }
        });

        battlefieldHTML += `
                </div>
              </div>

              <!-- Reserves -->
              <div class="bg-amber-950/30 p-3 rounded-lg border border-amber-800/40">
                <h5 class="text-xs font-semibold text-amber-400 mb-2 flex items-center justify-between">
                  <span><i data-lucide="shield-alert" class="w-3 h-3 inline mr-1"></i>Reserves</span>
                  <span class="bg-amber-950 px-2 py-0.5 rounded text-[10px]">${reservesCount}</span>
                </h5>
                <div id="zone-reserves-${team.id}" ondragover="allowDrop(event)" ondrop="drop(event, '${currentEvent.id}', '${battlefield.id}', '${team.id}', 'reserves')" class="bg-slate-800/50 rounded p-2 min-h-[150px] overflow-y-auto space-y-2">
        `;

        players.forEach(player => {
          if (reserveIds.includes(player.id)) {
            battlefieldHTML += createPlayerCardHTML(player, team.id);
          }
        });

        battlefieldHTML += `
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // Add Team Button
      battlefieldHTML += `
        <div class="mt-3 pt-3 border-t border-slate-700">
          <button onclick="addTeamToBattlefield('${currentEvent.id}', '${battlefield.id}')" class="w-full flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-medium transition">
            <i data-lucide="plus" class="w-3 h-3"></i> Add Another Team
          </button>
        </div>
      `;

      battlefieldHTML += `</div>`;
      div.innerHTML = battlefieldHTML;
      return div;
    }

    function createPlayerCardHTML(player, teamId) {
      return `
        <div id="player-card-${player.id}-${teamId}" draggable="true" ondragstart="drag(event, '${player.id}')" class="bg-slate-800 p-2 rounded-lg border border-slate-700/80 shadow-sm hover:border-indigo-500 cursor-grab active:cursor-grabbing transition text-[12px]">
          <div class="font-semibold text-slate-100">${player.name}</div>
          <div class="text-[10px] text-slate-400">${player.role}</div>
        </div>
      `;
    }

    function addTeamToBattlefield(eventId, battlefieldId) {
      const teamName = prompt('Enter team name:');
      if (!teamName) return;

      const currentEvent = events.find(e => e.id === eventId);
      const battlefield = currentEvent.battlefields.find(bf => bf.id === battlefieldId);

      if (battlefield) {
        battlefield.teams.push({
          id: 't_' + Date.now(),
          name: teamName,
          lineups: { starters: [], reserves: [] }
        });
        saveData();
        loadEventBattlefields();
      }
    }

    function deleteBattlefield(eventId, battlefieldId) {
      if (!confirm('Delete this battlefield and all its teams?')) return;
      const currentEvent = events.find(e => e.id === eventId);
      currentEvent.battlefields = currentEvent.battlefields.filter(bf => bf.id !== battlefieldId);
      saveData();
      loadEventBattlefields();
    }

    function deleteTeam(eventId, battlefieldId, teamId) {
      if (!confirm('Delete this team?')) return;
      const currentEvent = events.find(e => e.id === eventId);
      const battlefield = currentEvent.battlefields.find(bf => bf.id === battlefieldId);
      battlefield.teams = battlefield.teams.filter(t => t.id !== teamId);
      saveData();
      loadEventBattlefields();
    }

    // --- Drag and Drop API ---
    function allowDrop(e) { e.preventDefault(); }

    function drag(e, playerId) {
      e.dataTransfer.setData("text/plain", playerId);
    }

    function drop(e, eventId, battlefieldId, teamId, targetZone) {
      e.preventDefault();
      const playerId = e.dataTransfer.getData("text/plain");
      const currentEvent = events.find(ev => ev.id === eventId);
      if (!currentEvent) return;

      const battlefield = currentEvent.battlefields.find(bf => bf.id === battlefieldId);
      if (!battlefield) return;

      const team = battlefield.teams.find(t => t.id === teamId);
      if (!team) return;

      // Clear player from existing categories
      team.lineups.starters = team.lineups.starters.filter(id => id !== playerId);
      team.lineups.reserves = team.lineups.reserves.filter(id => id !== playerId);

      // Add to new zone if target isn't unassigned
      if (targetZone === 'starters') team.lineups.starters.push(playerId);
      if (targetZone === 'reserves') team.lineups.reserves.push(playerId);

      saveData();
      loadEventBattlefields();
    }
  </script>
</body>
</html>
